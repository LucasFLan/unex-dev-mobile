spring.application.name=serv_soft

# Variáveis locais (MAIL_*, JWT_SECRET...) podem ficar em apps/backend/chamaAi/.env, que não vai para o Git.
# Modelo: .env.example
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servsoft}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

chamaai.admin.emails=${ADMIN_EMAILS:}

# JWT: em producao defina JWT_SECRET (minimo 32 caracteres). Sem ele, uma chave aleatoria e gerada a cada subida.
chamaai.jwt.segredo=${JWT_SECRET:}
chamaai.jwt.validade=${JWT_VALIDADE:PT1H}

# Swagger UI (http://localhost:8080/swagger-ui.html)
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# E-mail (recuperação de senha). Gmail: senha de app de 16 letras, não a senha da conta.
# Sem MAIL_USERNAME/MAIL_PASSWORD os e-mails só são escritos no log.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
