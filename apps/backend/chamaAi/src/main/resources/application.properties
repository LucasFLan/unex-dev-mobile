spring.application.name=serv_soft

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servsoft}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

chamaai.admin.emails=${ADMIN_EMAILS:}

# JWT: em producao defina JWT_SECRET (minimo 32 caracteres). Sem ele, uma chave aleatoria e gerada a cada subida.
chamaai.jwt.segredo=${JWT_SECRET:}
chamaai.jwt.validade=${JWT_VALIDADE:PT1H}
