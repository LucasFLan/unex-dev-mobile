<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <title>Sem conexão · ChamaAí</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #F8FAFC; color: #1e293b; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 320px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 20px 0 6px; font-size: 18px; }
    p { margin: 0; font-size: 13px; line-height: 1.5; color: #64748b; }
    button {
      margin-top: 22px; width: 100%; height: 44px; border: 0; border-radius: 10px;
      background: #2563EB; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Você está sem conexão</h1>
    <p>O ChamaAí precisa de internet para mostrar anúncios e propostas. Confira sua conexão e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
